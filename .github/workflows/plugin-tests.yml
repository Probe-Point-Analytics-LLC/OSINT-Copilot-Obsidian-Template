name: Plugin Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .obsidian/plugins/Obsidian-OSINT-Copilot-plugin
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
        
    - name: Run Tests
      run: npm test
